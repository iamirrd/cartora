[project]
name = "rez"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amirkakavand", email = "amirkakavand82@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-allauth[socialaccount]>=65.19.4",
    "django-filter>=26.2",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "fcm-django>=3.2.0",
    "firebase-admin>=7.7.0",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rez = "rez:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
