version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rez_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: amirmohamad@30
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn Config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=rez_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=amirmohamad@30
      - POSTGRES_HOST=db
      - DJANGO_SETTINGS_MODULE=Config.settings
    depends_on:
      - db

volumes:
  postgres_data:
  media_volume: